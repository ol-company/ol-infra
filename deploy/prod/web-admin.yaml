# Trạng thái triển khai mong muốn của web-admin ở môi trường prod.
# image.digest và source.* do bot cập nhật qua Pull Request (build-image → open-deploy-pr.sh).
# runtime.* do con người sửa qua PR. Terraform đọc file này khi deploy.
module: web-admin
image:
  digest: ""   # sha256:... — rỗng nghĩa là chưa từng build, Terraform bỏ qua module này
source:
  repository: ol-company/ol-web-admin
  revision: ""
  version: ""
  configRevision: ""
  toolingRevision: ""
runtime:
  cpu: 256            # Đơn vị CPU của Fargate (1024 = 1 vCPU)
  memory: 512         # MiB
  desiredCount: 2
  minCount: 2
  maxCount: 4         # Autoscaling theo CPU 60%
  env:
    APP_NAME: "OL-Platform Admin"
