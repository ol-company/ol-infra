# Trạng thái triển khai mong muốn của keycloak ở môi trường prod.
# image.digest và source.* do bot cập nhật qua Pull Request (build-image → open-deploy-pr.sh).
# runtime.* do con người sửa qua PR. Terraform đọc file này khi deploy.
module: keycloak
image:
  digest: ""   # sha256:... — rỗng nghĩa là chưa từng build, Terraform bỏ qua module này
source:
  repository: ol-company/ol-build-tooling
  revision: ""
  version: ""
  configRevision: ""
  toolingRevision: ""
runtime:
  cpu: 1024            # Đơn vị CPU của Fargate (1024 = 1 vCPU)
  memory: 2048         # MiB
  desiredCount: 2
  minCount: 2
  maxCount: 3         # Autoscaling theo CPU 60%
  env:
    KC_LOG_LEVEL: "info"
