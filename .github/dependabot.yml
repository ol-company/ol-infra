version: 2
updates:
  # Nâng provider Terraform (aws, random) — PR sẽ chạy plan ở job validate
  - package-ecosystem: terraform
    directories: ["/infrastructure/envs/*", "/infrastructure/bootstrap/*"]
    schedule: { interval: weekly, day: monday, time: "08:00", timezone: Asia/Ho_Chi_Minh }
    commit-message: { prefix: build }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "08:00", timezone: Asia/Ho_Chi_Minh }
    groups:
      github-actions: { patterns: ["*"] }
    commit-message: { prefix: ci }
